# Everything that runs without the game: lint, and the pak builder + package checks against both public mods
# (checked out side by side; a sibling uses the branch of the same name when it exists, else main).
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  RUFF_VERSION: "0.16.9"
  LUA_DIRS: tools

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lua5.4 lua-check shellcheck
          pip install -q "ruff==$RUFF_VERSION"
      - name: Lua syntax (luac -p, all mod Lua)
        run: |
          git ls-files $LUA_DIRS | grep '\.lua$' > lua_files.txt
          echo "$(wc -l < lua_files.txt) Lua files"
          xargs -a lua_files.txt luac5.4 -p
      - name: luacheck (errors block, warnings reported)
        run: |
          set +e
          xargs -a lua_files.txt luacheck --formatter plain --codes > luacheck.txt; rc=$?
          echo "luacheck: $(grep -c ': (W' luacheck.txt) warnings, $(grep -c ': (E' luacheck.txt) errors" | tee -a "$GITHUB_STEP_SUMMARY"
          grep ': (E' luacheck.txt
          [ $rc -le 1 ]
      - name: ruff (real errors block)
        run: |
          ruff check --no-cache --select E9,F63,F7,F82 --output-format github .
      - name: ruff report (non-blocking counts)
        run: |
          { echo '```'; ruff check --no-cache --statistics --exit-zero .; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: shellcheck (errors block, warnings reported)
        run: |
          git ls-files '*.sh' > sh_files.txt
          xargs -a sh_files.txt shellcheck -S error
          echo "shellcheck warnings: $(xargs -a sh_files.txt shellcheck -S warning -f gcc | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: PowerShell syntax (parse every .ps1)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.ps1') {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$err)
            if ($err) { $bad++; $err | ForEach-Object { "::error file=$f,line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          "$((git ls-files '*.ps1').Count) .ps1 files, $bad with parse errors"
          exit [int]($bad -gt 0)

  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: BG3Tools
      - name: Pick sibling branches
        id: sib
        run: |
          br="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for r in LootAdvisor BuildAdvisor; do
            if git ls-remote --exit-code --heads "https://github.com/md12ol/$r.git" "$br" >/dev/null; then ref=$br; else ref=main; fi
            echo "$r=$ref" >> "$GITHUB_OUTPUT"; echo "$r @ $ref"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: md12ol/LootAdvisor
          ref: ${{ steps.sib.outputs.LootAdvisor }}
          path: LootAdvisor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: md12ol/BuildAdvisor
          ref: ${{ steps.sib.outputs.BuildAdvisor }}
          path: BuildAdvisor
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m compileall -q BG3Tools/tools
      - name: Pak builder round trip + package folders complete per INSTALL.md
        run: |
          python BG3Tools/tools/ci_release.py check LootAdvisor LootAdvisor/LootAdvisor
          python BG3Tools/tools/ci_release.py check BuildAdvisor BuildAdvisor/BuildAdvisor
